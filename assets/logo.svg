<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 10 жилийн ойн алтан хувилбар: цэнхэр (#47eed0) байсныг алтан
       өнгөөр сольж, зоосны гуулин өнгөтэй нийцүүлэв -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffefc0"/>
      <stop offset="0.5" stop-color="#e0bb4e"/>
      <stop offset="1" stop-color="#b08c2c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#131313"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#3a3220" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="12.6 3.5" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="8" r="2.6" fill="#ffefc0"/>
  <text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800"
    font-size="21" fill="url(#gold)">10</text>
</svg>
